version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - KV13_DEVICE=cpu
      - KV13_QUANTIZE=4bit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  website:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
