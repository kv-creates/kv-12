[project]
name = "kv12"
version = "12.2.0"
description = "KV-12 Autonomous Code Intelligence LLM - Predict, Review, Fix, Modernize"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "kv-creates", email = "kv04.krishna@gmail.com"}]
keywords = ["llm", "code-intelligence", "bug-detection", "code-review", "ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "tokenizers>=0.15.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "accelerate>=0.28.0",
  "bitsandbytes>=0.43.0",
  "datasets>=2.18.0",
  "tree-sitter>=0.20.0",
  "tree-sitter-languages>=1.10.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "black", "ruff", "mypy"]
train = ["deepspeed>=0.14", "wandb", "flash-attn"]

[project.urls]
Homepage = "https://kv-13.netlify.app"
Repository = "https://github.com/kv-creates/KV-13"
Documentation = "https://github.com/kv-creates/KV-13/blob/main/docs/ARCHITECTURE.md"
"Bug Tracker" = "https://github.com/kv-creates/KV-13/issues"

[project.scripts]
kv13 = "model.inference.engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
